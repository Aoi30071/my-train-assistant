<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鐵路客車乘務助手</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header><h2>客車乘務助手 🚄</h2></header>

    <div class="section-title">1. 選擇車種</div>
    <div class="grid-container" id="trainSelector">
        <div class="btn" onclick="selectTrain('emu500', this)">EMU500</div>
        <div class="btn" onclick="selectTrain('emu700', this)">EMU700</div>
        <div class="btn" onclick="selectTrain('emu800', this)">EMU800</div>
        <div class="btn" onclick="selectTrain('emu900', this)">EMU900</div>
        <div class="btn" onclick="selectTrain('temu1000', this)">TEMU1000 (太魯閣)</div>
        <div class="btn" onclick="selectTrain('temu2000', this)">TEMU2000 (普悠瑪)</div>
        <div class="btn" onclick="selectTrain('emu3000', this)">EMU3000</div>
        <div class="btn" onclick="selectTrain('dr1000', this)">DR1000</div>
    </div>

    <div id="categorySection" class="hidden">
        <div class="section-title">2. 故障分類</div>
        <div class="grid-container" id="categorySelector">
            <div class="btn" onclick="loadFaults('door', this)">🚪 車門與階梯</div>
            <div class="btn" onclick="loadFaults('hvac', this)">❄️ 空調與照明</div>
            <div class="btn" onclick="loadFaults('water', this)">🚻 給水與衛生</div>
            <div class="btn" onclick="loadFaults('pids', this)">📢 資訊與廣播</div>
            <div class="btn full-width" onclick="loadFaults('brake', this)">⚡ 動力與軔機輔助</div>
        </div>
    </div>

    <div id="faultSection" class="hidden">
        <div class="section-title">3. 處置步驟</div>
        <div class="list-container" id="faultList"></div>
    </div>

    <script>
        let selectedTrain = '';

        function selectTrain(trainFile, element) {
            selectedTrain = trainFile;
            document.querySelectorAll('#trainSelector .btn').forEach(b => b.classList.remove('active'));
            element.classList.add('active');
            document.getElementById('categorySection').classList.remove('hidden');
            document.getElementById('faultSection').classList.add('hidden');
        }

        async function loadFaults(category, element) {
            document.querySelectorAll('#categorySelector .btn').forEach(b => b.classList.remove('active'));
            element.classList.add('active');

            const listContainer = document.getElementById('faultList');
            listContainer.innerHTML = "讀取資料中...";
            document.getElementById('faultSection').classList.remove('hidden');

            try {
                const response = await fetch(`data/troubleshooting/${selectedTrain}.md`);
                if (!response.ok) throw new Error('尚未建立該車種的資料檔案 (.md)');
                let text = await response.text();

                // 移除惱人的 Windows 換行符號 (\r)，統一換成 \n
                text = text.replace(/\r/g, '');

                // 尋找目標分類的位置 (例如 ### door)
                const categoryRegex = new RegExp(`###\\s+${category}\\b`, 'i');
                const matchIndex = text.search(categoryRegex);

                if (matchIndex === -1) {
                    listContainer.innerHTML = "<div class='fault-item'>此分類目前尚無資料，等妳來補充！</div>";
                    return;
                }

                // 擷取從目前的分類到下一個 ### 之間的全部文字
                let targetText = text.substring(matchIndex);
                const nextSectionIndex = targetText.indexOf('###', 4);
                if (nextSectionIndex !== -1) {
                    targetText = targetText.substring(0, nextSectionIndex);
                }

                // 根據 #### 拆分故障項目
                const items = targetText.split('####');
                let htmlContent = '';

                // 略過第 0 個（那是大分類標題 ### door 本身）
                for (let i = 1; i < items.length; i++) {
                    const itemText = items[i].trim();
                    if (!itemText) continue;

                    const lines = itemText.split('\n');
                    let rawTitle = lines[0].trim();
                    const steps = lines.slice(1).join('\n').trim();

                    // 解析【次級分類】標籤
                    let subCatTag = '';
                    const tagMatch = rawTitle.match(/(【.*?】)/);
                    if (tagMatch) {
                        subCatTag = `<span class="sub-cat-tag">${tagMatch[1]}</span>`;
                        rawTitle = rawTitle.replace(tagMatch[1], '').replace('⚠️', '').trim();
                    }

                    htmlContent += `
                        <div class='fault-item'>
                            ${subCatTag}
                            <div class='fault-title'>⚠️ ${rawTitle}</div>
                            <div class='fault-steps'>${steps}</div>
                        </div>`;
                }

                listContainer.innerHTML = htmlContent || "<div class='fault-item'>此分類目前尚無資料。</div>";

            } catch (error) {
                listContainer.innerHTML = `<div class='fault-item'>讀取失敗: ${error.message}</div>`;
            }
        }
    </script>
</body>
</html>
